<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Perry Ellis</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;background:#fff;color:#111;margin:20px}
</style>
</head>

<body>

<h2>Dashboard Perry Ellis</h2>
<div id="status">Cargando datos...</div>

<script>

// 🔥 LINKS
const VENTAS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrkp1ihwlvN7EZTRlbc5iBg_jouqROmirYiZVjxwTfCyM_qxemYdJyznMVCUUH9Q/pub?gid=778855662&single=true&output=csv";
const PRODUCTOS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrkp1ihwlvN7EZTRlbc5iBg_jouqROmirYiZVjxwTfCyM_qxemYdJyznMVCUUH9Q/pub?gid=189275553&single=true&output=csv";

// 🔥 CSV PARSER (ARREGLA NÚMEROS)
function parseCSV(text){
    const rows = text.trim().split("\n").map(r=>r.split(","));
    const headers = rows[0];

    return rows.slice(1).map(r=>{
        let obj = {};

        headers.forEach((h,i)=>{
            let value = r[i];

            if(value){
                value = value.replace(/"/g,"").trim();

                // quitar separadores miles
                value = value.replace(/,/g,"");

                if(!isNaN(value) && value !== ""){
                    value = Number(value);
                }
            }

            obj[h.trim()] = value;
        });

        return obj;
    });
}

// 🔥 DETECTAR MES (SOLUCIÓN FINAL)
function getMes(fecha){

    if(!fecha) return null;

    const str = fecha.toString().toLowerCase();

    if(str.includes("enero")) return 0;
    if(str.includes("febrero")) return 1;
    if(str.includes("marzo")) return 2;
    if(str.includes("abril")) return 3;
    if(str.includes("mayo")) return 4;
    if(str.includes("junio")) return 5;
    if(str.includes("julio")) return 6;
    if(str.includes("agosto")) return 7;
    if(str.includes("septiembre") || str.includes("setiembre")) return 8;
    if(str.includes("octubre")) return 9;
    if(str.includes("noviembre")) return 10;
    if(str.includes("diciembre")) return 11;

    // fallback
    const d = new Date(fecha);
    if(!isNaN(d)) return d.getMonth();

    return null;
}

// 🔥 LOAD DATA
async function loadData(){
    try{
        const ventasText = await fetch(VENTAS_URL).then(r=>r.text());
        const productosText = await fetch(PRODUCTOS_URL).then(r=>r.text());

        const ventas = parseCSV(ventasText);
        const productos = parseCSV(productosText);

        // 🔥 VALIDACIÓN ABRIL
        let abrilCount = 0;

        ventas.forEach(r=>{
            const mes = getMes(r.Fecha);
            if(mes === 3) abrilCount++;
        });

        document.getElementById("status").innerHTML =
        "✅ Datos cargados<br>Ventas: "+ventas.length+
        "<br>Productos: "+productos.length+
        "<br>Registros abril: "+abrilCount;

        console.log("VENTAS:", ventas);

    }catch(e){
        document.getElementById("status").innerHTML = "❌ Error";
        console.error(e);
    }
}

loadData();

</script>

</body>
</html>
