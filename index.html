<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Perry Ellis</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#fff;
    color:#111;
    margin:20px;
}

/* TABS */
.tabs{
    display:flex;
    gap:10px;
    margin-bottom:6px;
}

.tab{
    padding:10px 18px;
    border-radius:20px;
    border:1px solid #ccc;
    cursor:pointer;
}

.tab.active{
    background:#000;
    color:#fff;
}

/* KPIs */
.kpis{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin:15px 0;
}

.kpi{
    border:1px solid #eee;
    border-radius:10px;
    padding:12px 16px;
    min-width:160px;
}

.kpi span{
    font-size:11px;
    color:#666;
    display:block;
}

.kpi strong{
    font-size:18px;
    font-weight:600;
}

/* 🔥 SELL THROUGH LIMPIO */
.st-badge{
    margin-top:6px;
    display:inline-block;
    padding:4px 8px;
    border-radius:10px;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.4px;
    background:#f5f5f5;
    color:#333;
}

.st-badge.bueno{
    background:#e6f4ea;
    color:#1b7f3a;
}

.st-badge.medio{
    background:#f2f2f2;
    color:#666;
}

.st-badge.bajo{
    background:#fdecea;
    color:#c62828;
}

</style>
</head>

<body>

<h2>PERRY ELLIS DASHBOARD</h2>

<div class="tabs">
    <div class="tab active">PRODUCTOS</div>
</div>

<div class="kpis" id="kpis"></div>

<script>

/* 🔥 FORMATO DINERO */
function formatMoney(n){
    return "$" + n.toLocaleString("es-MX");
}

/* 🔥 EJEMPLO DATA (AQUÍ VA TU DATA REAL) */
let piezasVendidas = 1240;
let piezasCompradas = 2800;
let totalVendido = 2286014;

/* 🔥 CALCULO SELL THROUGH */
let sellThrough = piezasVendidas / piezasCompradas;

/* 🔥 SEMÁFORO */
let stLabel = "";
if (sellThrough >= 0.7){
    stLabel = "BUENO";
} else if (sellThrough >= 0.4){
    stLabel = "MEDIO";
} else {
    stLabel = "BAJO";
}

/* 🔥 RENDER KPIs */
document.getElementById("kpis").innerHTML = `
    <div class="kpi">
        <span>$ VENDIDO</span>
        <strong>${formatMoney(totalVendido)}</strong>
    </div>

    <div class="kpi">
        <span>PZAS VENDIDAS</span>
        <strong>${piezasVendidas}</strong>
    </div>

    <div class="kpi">
        <span>SELL THROUGH</span>
        <strong>${(sellThrough*100).toFixed(1)}%</strong>
        <div class="st-badge ${stLabel.toLowerCase()}">
            ${stLabel}
        </div>
    </div>
`;

</script>

</body>
</html>
