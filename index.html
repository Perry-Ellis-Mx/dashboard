<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Perry Ellis - Google Sheets</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial;
    background:#fff;
    color:#111;
    margin:20px;
}
h1{
    font-size:22px;
    margin-bottom:20px;
}
</style>
</head>

<body>

<h1>Dashboard Perry Ellis</h1>

<div id="status">Cargando datos...</div>

<script>

// 🔥 LINKS GOOGLE SHEETS
const VENTAS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrkp1ihwlvN7EZTRlbc5iBg_jouqROmirYiZVjxwTfCyM_qxemYdJyznMVCUUH9Q/pub?gid=778855662&single=true&output=csv";

const PRODUCTOS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrkp1ihwlvN7EZTRlbc5iBg_jouqROmirYiZVjxwTfCyM_qxemYdJyznMVCUUH9Q/pub?gid=189275553&single=true&output=csv";

// 🔥 PARSER CORRECTO
function parseCSV(text){
    const rows = text.trim().split("\n").map(r=>r.split(","));
    const headers = rows[0];

    return rows.slice(1).map(r=>{
        let obj = {};

        headers.forEach((h,i)=>{
            let value = r[i];

            if(value){
                value = value.replace(/"/g, "").trim();

                // 🔥 limpia miles
                value = value.replace(/,/g,"");

                // convierte número
                if(!isNaN(value) && value !== ""){
                    value = Number(value);
                }
            }

            obj[h.trim()] = value;
        });

        return obj;
    });
}

// 🔥 CARGA DATOS
async function loadData(){
    try{
        const ventasText = await fetch(VENTAS_URL).then(r=>r.text());
        const productosText = await fetch(PRODUCTOS_URL).then(r=>r.text());

        const ventas = parseCSV(ventasText);
        const productos = parseCSV(productosText);

        document.getElementById("status").innerHTML = 
        "✅ Datos cargados<br>Ventas: "+ventas.length+" | Productos: "+productos.length;

        console.log("Ventas:", ventas);
        console.log("Productos:", productos);

    }catch(e){
        document.getElementById("status").innerHTML = "❌ Error cargando datos";
        console.error(e);
    }
}

// 🔥 AUTO LOAD
loadData();

</script>

</body>
</html>
