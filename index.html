<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Perry Ellis</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#fff;
    color:#111;
    margin:20px;
}

h1{
    font-size:22px;
    margin-bottom:10px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:6px; /* 🔥 ajuste clave */
}

.tab{
    padding:10px 18px;
    border-radius:20px;
    border:1px solid #ccc;
    cursor:pointer;
}

.tab.active{
    background:#000;
    color:#fff;
}

#productos{
    margin-top:0;
    padding-top:0;
}

h2{
    margin-top:0;
}

input{
    padding:10px;
    border-radius:20px;
    border:1px solid #ccc;
    width:300px;
}

</style>
</head>

<body>

<h1>PERRY ELLIS</h1>

<div class="tabs">
    <div class="tab">VENTAS</div>
    <div class="tab active">PRODUCTOS</div>
</div>

<div id="productos">

<h2>PRODUCTOS</h2>

<input placeholder="Buscar por modelo, descripción, categoría...">

<br><br>

<div id="status">Cargando datos...</div>

</div>

<script>

const VENTAS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrkp1ihwlvN7EZTRlbc5iBg_jouqROmirYiZVjxwTfCyM_qxemYdJyznMVCUUH9Q/pub?gid=778855662&single=true&output=csv";

function parseCSV(text){
    const rows = text.trim().split("\n").map(r=>r.split(","));
    const headers = rows[0];

    return rows.slice(1).map(r=>{
        let obj = {};

        headers.forEach((h,i)=>{
            let value = r[i];

            if(value){
                value = value.replace(/"/g,"").trim();
                value = value.replace(/,/g,"");

                if(!isNaN(value) && value !== ""){
                    value = Number(value);
                }
            }

            obj[h.trim()] = value;
        });

        return obj;
    });
}

function getMes(fecha){
    if(!fecha) return null;

    const str = fecha.toString().toLowerCase();

    if(str.includes("abril")) return 3;

    const d = new Date(fecha);
    if(!isNaN(d)) return d.getMonth();

    return null;
}

async function loadData(){
    try{
        const ventasText = await fetch(VENTAS_URL).then(r=>r.text());
        const ventas = parseCSV(ventasText);

        let abril = 0;

        ventas.forEach(r=>{
            const mes = getMes(r.Fecha);
            if(mes === 3) abril++;
        });

        document.getElementById("status").innerHTML = "Registros abril: " + abril;

    }catch(e){
        document.getElementById("status").innerHTML = "Error";
    }
}

loadData();

</script>

</body>
</html>
