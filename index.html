<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Perry Ellis - Productos con Imágenes</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#fff;
    color:#111;
    margin:20px;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:left;
    vertical-align:middle;
}
th{
    background:#000;
    color:#fff;
}
.imgCell{
    width:90px;
}
.imgCell img{
    width:70px;
    height:70px;
    object-fit:contain;
    background:#fff;
    border-radius:8px;
}
</style>
</head>
<body>

<h2>PERRY ELLIS DASHBOARD</h2>

<table>
<thead>
<tr>
<th>Imagen</th>
<th>Modelo</th>
<th>Categoría</th>
<th>Proveedor</th>
<th>$ Vendido</th>
</tr>
</thead>

<tbody id="productosBody"></tbody>
</table>

<script>

const PRODUCTOS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrkp1ihwlvN7EZTRlbc5iBg_jouqROmirYiZVjxwTfCyM_qxemYdJyznMVCUUH9Q/pub?gid=189275553&single=true&output=csv";

function parseCSV(text){
    const rows = text.trim().split("\n").map(r=>r.split(","));
    const headers = rows[0];

    return rows.slice(1).map(r=>{
        let obj = {};
        headers.forEach((h,i)=>{
            obj[h.trim()] = r[i] || "";
        });
        return obj;
    });
}

async function loadProductos(){

    const text = await fetch(PRODUCTOS_URL).then(r=>r.text());
    const data = parseCSV(text);

    let html = "";

    data.forEach(row=>{

        const img = row["Imagen"] || "";

        html += `
        <tr>
            <td class="imgCell">
                <img src="${img}" loading="lazy"
                onerror="this.src='https://via.placeholder.com/70?text=PE'">
            </td>
            <td>${row["Modelo"] || ""}</td>
            <td>${row["Categoria"] || ""}</td>
            <td>${row["Proveedor"] || ""}</td>
            <td>${row["$ Vendido"] || ""}</td>
        </tr>
        `;
    });

    document.getElementById("productosBody").innerHTML = html;
}

loadProductos();

</script>

</body>
</html>
