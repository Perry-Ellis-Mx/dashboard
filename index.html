<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Perry Ellis</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#fff;color:#111;margin:20px}

h1{font-size:22px;margin-bottom:10px}

.tabs{display:flex;gap:10px;margin-bottom:6px}
.tab{padding:10px 18px;border-radius:20px;border:1px solid #ccc;cursor:pointer}
.tab.active{background:#000;color:#fff}

#productos{margin-top:0;padding-top:0}

.searchBox{margin-top:0}
input{padding:10px;border-radius:20px;border:1px solid #ccc;width:320px}

/* KPIs */
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}
.kpi{border:1px solid #eee;border-radius:10px;padding:10px 14px;min-width:140px}
.kpi span{font-size:11px;color:#666;display:block}
.kpi strong{font-size:16px;font-weight:600}

/* Chips */
#activeSalesFilters,#activeProductFilters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:#000;color:#fff;padding:6px 10px;border-radius:20px;font-size:11px;display:flex;gap:6px}

</style>
</head>

<body>

<h1>PERRY ELLIS</h1>

<div class="tabs">
<div class="tab">VENTAS</div>
<div class="tab active">PRODUCTOS</div>
</div>

<div id="productos">

<div class="searchBox">
<input placeholder="Buscar por modelo, descripción, categoría, proveedor o estilo...">
</div>

<div id="activeProductFilters"></div>

<div class="kpis" id="kpis"></div>

<div id="status">Cargando datos...</div>

</div>

<script>

const VENTAS_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSrkp1ihwlvN7EZTRlbc5iBg_jouqROmirYiZVjxwTfCyM_qxemYdJyznMVCUUH9Q/pub?gid=778855662&single=true&output=csv";

function parseCSV(text){
 const rows=text.trim().split("\n").map(r=>r.split(","));
 const headers=rows[0];
 return rows.slice(1).map(r=>{
  let obj={};
  headers.forEach((h,i)=>{
   let value=r[i];
   if(value){
    value=value.replace(/"/g,"").trim();
    value=value.replace(/,/g,"");
    if(!isNaN(value)&&value!="") value=Number(value);
   }
   obj[h.trim()]=value;
  });
  return obj;
 });
}

function formatMoney(n){
 return "$"+n.toLocaleString("es-MX");
}

async function loadData(){
 try{
  const ventasText=await fetch(VENTAS_URL).then(r=>r.text());
  const data=parseCSV(ventasText);

  let totalVendido=0;
  let totalComprado=0;
  let piezasVendidas=0;
  let piezasCompradas=0;

  data.forEach(r=>{
   totalVendido+=r["$ Vendido"]||0;
   totalComprado+=r["$ Comprado"]||0;
   piezasVendidas+=r["Pzas Vendidas"]||0;
   piezasCompradas+=r["Pzas Compradas"]||0;
  });

  let sellThrough=piezasVendidas/piezasCompradas;

  document.getElementById("kpis").innerHTML=`
  <div class="kpi"><span>$ VENDIDO</span><strong>${formatMoney(totalVendido)}</strong></div>
  <div class="kpi"><span>PZAS VENDIDAS</span><strong>${piezasVendidas}</strong></div>
  <div class="kpi"><span>SELL THROUGH</span><strong>${(sellThrough*100).toFixed(1)}%</strong></div>
  <div class="kpi"><span>$ COMPRADO</span><strong>${formatMoney(totalComprado)}</strong></div>
  <div class="kpi"><span>PZAS COMPRADAS</span><strong>${piezasCompradas}</strong></div>
  `;

  document.getElementById("status").innerHTML="Datos cargados";

 }catch(e){
  document.getElementById("status").innerHTML="Error";
 }
}

loadData();

</script>

</body>
</html>
